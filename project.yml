name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # CI hardening — see project.yml comment history in bootstrap PRs for rationale.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      # Required so `@testable import CyberpunkMonsterCrawl` in the test
      # target can link against the Debug-configuration app module.
      SWIFT_ENABLE_TESTABILITY: "YES"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources: [CyberpunkMonsterCrawl]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        # Host the test bundle inside the app binary so `@testable import
        # CyberpunkMonsterCrawl` can resolve app-module symbols at runtime.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CyberpunkMonsterCrawl.app/CyberpunkMonsterCrawl
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: CyberpunkMonsterCrawl
  CyberpunkMonsterCrawlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CyberpunkMonsterCrawlUITests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_TARGET_NAME: CyberpunkMonsterCrawl
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  # Everyday scheme: both test bundles against the Debug configuration (the
  # unit-test bundle needs SWIFT_ENABLE_TESTABILITY, which is Debug-only).
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets:
        - name: CyberpunkMonsterCrawlTests
        - name: CyberpunkMonsterCrawlUITests
      parallelizable: false
  # CYBERPUN-17-4-t6: the same launch -> PLAY -> gameplay journey, run against
  # the **Release** configuration - the one the shipped product and the
  # runtime probe actually use, and the one nothing verified before.
  #
  # This exists because every structural safety net in this codebase used to
  # be `assert`-based, i.e. compiled out of Release, while CI only ever built
  # Debug: a regression that needs an optimized build (or a Release-only
  # compile-out, `#if DEBUG` code that a Debug run silently depends on) to
  # manifest would go red in no test we had and still ship. So this scheme
  # runs the UI journey where the audits are non-fatal and the debug-only
  # code is gone.
  #
  # Only the UI-test bundle is listed on purpose: `CyberpunkMonsterCrawlTests`
  # uses `@testable import`, which cannot link against a Release build of the
  # app module (testability is Debug-only, deliberately - see `settings`), so
  # adding it here would fail to build rather than add coverage.
  CyberpunkMonsterCrawl-Release:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    run:
      config: Release
    test:
      config: Release
      targets:
        - name: CyberpunkMonsterCrawlUITests
      parallelizable: false
