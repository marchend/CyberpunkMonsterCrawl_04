name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # CI hardening — see project.yml comment history in bootstrap PRs for rationale.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      # Required so `@testable import CyberpunkMonsterCrawl` in the test
      # target can link against the Debug-configuration app module.
      SWIFT_ENABLE_TESTABILITY: "YES"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources:
      - path: CyberpunkMonsterCrawl
        excludes:
          # Stray empty duplicate left behind by an earlier reorg attempt;
          # the real implementation lives at
          # Sources/Actors/PlayerNode+Rabies.swift. Two files sharing one
          # basename in the same target is a hard Swift compiler error
          # ("Filename ... used twice"), so this stub must be excluded
          # from the build until it is deleted outright.
          - "Sources/Actors/Player/PlayerNode+Rabies.swift"
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        # Host the test bundle inside the app binary so `@testable import
        # CyberpunkMonsterCrawl` can resolve app-module symbols at runtime.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CyberpunkMonsterCrawl.app/CyberpunkMonsterCrawl
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: CyberpunkMonsterCrawl
  CyberpunkMonsterCrawlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CyberpunkMonsterCrawlUITests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_TARGET_NAME: CyberpunkMonsterCrawl
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets:
        - name: CyberpunkMonsterCrawlTests
        - name: CyberpunkMonsterCrawlUITests
      parallelizable: false
