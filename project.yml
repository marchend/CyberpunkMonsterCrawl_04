name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources: [CyberpunkMonsterCrawl]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
        # CI hardening — see project.yml comment history in bootstrap PRs for rationale.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets: [CyberpunkMonsterCrawlTests]
      parallelizable: false
